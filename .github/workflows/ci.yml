name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (svelte-check + tsc)
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

      - name: Worker bundles for Cloudflare
        # Catches a dependency that drags a Node built-in into the Worker --
        # invisible to tsc, and only surfaces when the bundler follows imports.
        run: npx wrangler deploy --dry-run

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E suite
        run: npm run test:e2e
        env:
          REDIS_URL: redis://localhost:6379
