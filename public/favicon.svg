<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges" role="img" aria-labelledby="fav-title">
  <title id="fav-title">AI Department LAN Series</title>
  <!--
    Favicon build of src/assets/logo.svg. Same CRT geometry, shifted up 1px to
    centre it, sitting on a filled space-900 tile so the mark holds on both a
    light and a dark browser tab strip. The in-app logo stays transparent
    because it only ever sits on the app's own near-black ground.

    Colours are rgb() rather than hex for the same reason the source logo uses
    them. A bundler that inlines an SVG as a data URI does not escape "#", and
    the file truncates at the first hex colour.
  -->
  <rect width="32" height="32" rx="6" fill="rgb(11,13,17)"/>
  <g fill="rgb(43,196,222)">
    <rect x="3" y="3" width="26" height="2"/>
    <rect x="3" y="5" width="2" height="14"/>
    <rect x="27" y="5" width="2" height="14"/>
    <rect x="3" y="19" width="26" height="2"/>
    <rect x="14" y="21" width="4" height="3"/>
    <rect x="9" y="24" width="14" height="2"/>
  </g>
  <rect x="8" y="7"  width="15" height="3" fill="rgb(255,154,90)"/>
  <rect x="8" y="12" width="11" height="3" fill="rgb(43,196,222)"/>
</svg>
