<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64" fill="none" role="img" aria-labelledby="gl-title">
  <title id="gl-title">AI Department LAN Series</title>
  <!--
    A single-elimination bracket closing on one champion.

    Two mirrored brackets converge from the outside to a lit centre node. The
    four outer dots are the entrants and the orange node is the winner, so the
    mark says what the app does rather than decorating it. Built from straight
    runs and round caps with no gradient, no filter and no fine detail, because
    it has to survive at 24px in a nav bar as well as at poster size.

    Colours are rgb() rather than hex on purpose: a bundler may inline this as a
    data: URI, and an unescaped "#" truncates the document at the first colour.
  -->
  <g stroke="rgb(43,196,222)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 14 H21 V32 H24" />
    <path d="M13 50 H21 V32" />
    <path d="M51 14 H43 V32 H40" />
    <path d="M51 50 H43 V32" />
  </g>
  <g fill="rgb(43,196,222)">
    <circle cx="13" cy="14" r="4" />
    <circle cx="13" cy="50" r="4" />
    <circle cx="51" cy="14" r="4" />
    <circle cx="51" cy="50" r="4" />
  </g>
  <!-- the champion -->
  <circle cx="32" cy="32" r="7" fill="rgb(255,154,90)" />
</svg>
