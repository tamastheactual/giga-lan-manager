services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - REDIS_URL=redis://redis:6379
      # Set ADMIN_PASSWORD to require an admin login for any change (viewing stays
      # open). Provide it via your shell env or a .env file beside this compose file.
      # Leave unset to run fully open (a warning is logged).
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - SESSION_SECRET=${SESSION_SECRET:-}
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    # Enable both RDB snapshots and AOF logging for maximum durability
    command: redis-server --appendonly yes --appendfsync everysec --save 60 1 --save 300 10
    restart: unless-stopped

volumes:
  redis_data:
