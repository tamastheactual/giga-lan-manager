services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - REDIS_URL=redis://redis:6379
      # ADMIN_TOKEN decides who may CREATE tournaments on this instance.
      # Generate one with `npm run gen-token` and put it in a .env file beside
      # this compose file. Leave it unset and anyone who can reach the server can
      # create tournaments (a warning is logged at boot).
      #
      # Writing to an EXISTING tournament always needs that tournament's own
      # admin key, whether or not this is set.
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    # Enable both RDB snapshots and AOF logging for maximum durability
    command: redis-server --appendonly yes --appendfsync everysec --save 60 1 --save 300 10
    restart: unless-stopped

volumes:
  redis_data:
